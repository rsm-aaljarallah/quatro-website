<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Lato:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ─────────────────────────────────────────────────────────────
   Design tokens — exact palette from the original portfolio
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:           #0A0E1A;
  --bg-panel:     rgba(17, 24, 39, 0.92);
  --bg-card:      rgba(17, 24, 39, 0.95);
  --border:       rgba(232, 237, 245, 0.08);
  --border-hi:    rgba(232, 237, 245, 0.14);
  --text:         #F8FAFC;
  --text-mute:    #7A8FA8;
  --text-dim:     #4A5A6A;
  --silver:       #B8C8DC;
  --slate:        #4A6A8A;
  --accent-bg:    rgba(184,200,220,0.08);
  --accent-bd:    rgba(184,200,220,0.22);
  --accent-glow:  rgba(184,200,220,0.40);
  --serif:        'Playfair Display', Georgia, serif;
  --sans:         'Lato', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono:         'JetBrains Mono', SFMono-Regular, Menlo, monospace;
  --t-fast:       180ms cubic-bezier(.4,0,.2,1);
  --t-mid:        320ms cubic-bezier(.4,0,.2,1);
  --t-slow:       560ms cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ height:100%; margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  position: relative;
}

/* ─────────────────────────────────────────────────────────────
   Ambient background — soft radial vignette + sparse dot grid
   ───────────────────────────────────────────────────────────── */
body::before{
  content:'';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 1200px 700px at 50% -10%, rgba(184,200,220,0.06), transparent 70%),
    radial-gradient(ellipse 800px 600px at 100% 100%, rgba(74,106,138,0.05), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after{
  content:'';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle, rgba(184,200,220,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
  background-position: 0 0;
  pointer-events: none;
  z-index: 0;
  mask-image: linear-gradient(180deg, transparent, black 20%, black 80%, transparent);
}

/* ─────────────────────────────────────────────────────────────
   Layout shell
   ───────────────────────────────────────────────────────────── */
.app{
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─────────────────────────────────────────────────────────────
   Top navigation bar
   ───────────────────────────────────────────────────────────── */
.navbar{
  position: relative;
  z-index: 50;
  height: 64px;
  flex: 0 0 auto;
  background: rgba(10, 14, 26, 0.7);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  animation: slideDown .7s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slideDown{
  from{ opacity:0; transform: translateY(-12px); }
  to  { opacity:1; transform: translateY(0); }
}

.nav-inner{
  max-width: 1400px;
  height: 100%;
  margin: 0 auto;
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand{
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: default;
}
.brand-logo{
  width: 34px;
  height: 34px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--silver) 0%, var(--slate) 100%);
  display: grid;
  place-items: center;
  color: var(--bg);
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -.02em;
  position: relative;
  overflow: hidden;
  transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.brand-logo::after{
  content:'';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform .8s cubic-bezier(.4,0,.2,1);
}
.brand:hover .brand-logo{ transform: scale(1.06) rotate(-2deg); box-shadow: 0 0 20px var(--accent-glow); }
.brand:hover .brand-logo::after{ transform: translateX(100%); }
.brand-name{
  font-family: var(--serif);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  letter-spacing: .02em;
}

.nav-links{
  display: flex;
  align-items: center;
  gap: 2px;
}
.nav-link{
  position: relative;
  padding: 8px 14px;
  color: var(--text-mute);
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: .01em;
  text-decoration: none;
  border-radius: 5px;
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: color var(--t-fast);
}
.nav-link::before{
  content:'';
  position: absolute;
  inset: 0;
  border-radius: 5px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-bd);
  opacity: 0;
  transform: scale(.94);
  transition: opacity var(--t-fast), transform var(--t-fast);
  pointer-events: none;
}
.nav-link:hover{ color: var(--text); }
.nav-link:hover::before{ opacity: 1; transform: scale(1); }
.nav-link.is-active{ color: var(--silver); }
.nav-link.is-active::before{ opacity: 1; transform: scale(1); }

.nav-cta{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  background: linear-gradient(135deg, var(--slate) 0%, var(--silver) 100%);
  background-size: 200% 100%;
  background-position: 0% 50%;
  color: var(--bg);
  font-family: var(--serif);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .02em;
  text-decoration: none;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  transition: background-position var(--t-mid), box-shadow var(--t-mid), transform var(--t-fast);
}
.nav-cta:hover{
  background-position: 100% 50%;
  box-shadow: 0 0 24px var(--accent-glow), 0 4px 12px rgba(0,0,0,.2);
  transform: translateY(-1px);
}
.nav-cta:active{ transform: translateY(0); }

/* ─────────────────────────────────────────────────────────────
   Sub-toolbar — project breadcrumb + title + actions
   ───────────────────────────────────────────────────────────── */
.subbar{
  position: relative;
  z-index: 40;
  flex: 0 0 auto;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 28px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  animation: slideDown .8s cubic-bezier(.16,1,.3,1) .08s both;
}

.back-btn{
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-mute);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 5px;
  text-decoration: none;
  cursor: pointer;
  transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
}
.back-btn svg{ transition: transform var(--t-fast); }
.back-btn:hover{ color: var(--silver); background: var(--accent-bg); border-color: var(--accent-bd); }
.back-btn:hover svg{ transform: translateX(-3px); }

.proj-title-wrap{
  text-align: center;
  min-width: 0;
}
.proj-title-eyebrow{
  font-family: var(--mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--silver);
  margin-bottom: 2px;
  opacity: .85;
}
.proj-title{
  font-family: var(--serif);
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
  line-height: 1.2;
  letter-spacing: -.005em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.proj-subtitle{
  font-family: var(--serif);
  font-style: italic;
  font-size: 12.5px;
  color: var(--text-dim);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.actions{
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-btn{
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--text-mute);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  border-radius: 5px;
  cursor: pointer;
  text-decoration: none;
  transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.action-btn:hover{
  color: var(--silver);
  background: var(--accent-bg);
  border-color: var(--accent-bd);
}
.action-btn.is-primary{
  background: linear-gradient(135deg, var(--slate) 0%, var(--silver) 100%);
  background-size: 200% 100%;
  background-position: 0% 50%;
  color: var(--bg);
  font-weight: 700;
  border: none;
  transition: background-position var(--t-mid), box-shadow var(--t-mid), transform var(--t-fast);
}
.action-btn.is-primary:hover{
  background-position: 100% 50%;
  box-shadow: 0 0 18px var(--accent-glow);
  transform: translateY(-1px);
}

/* ─────────────────────────────────────────────────────────────
   Iframe stage with loading state
   ───────────────────────────────────────────────────────────── */
.stage{
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  background: var(--bg);
  animation: fadeIn 1s cubic-bezier(.16,1,.3,1) .25s both;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

.stage-frame{
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--bg);
  display: block;
}

/* Loading overlay — fades out once the iframe loads */
.stage-loader{
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  z-index: 5;
  transition: opacity .45s cubic-bezier(.4,0,.2,1), visibility .45s;
}
.stage-loader.is-hidden{ opacity: 0; visibility: hidden; pointer-events: none; }

.loader-core{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.loader-glyph{
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2px solid var(--border-hi);
  border-top-color: var(--silver);
  animation: spin 1.1s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.loader-text{
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .25em;
  color: var(--text-mute);
}

/* ─────────────────────────────────────────────────────────────
   Mobile menu trigger
   ───────────────────────────────────────────────────────────── */
.menu-trigger{
  display: none;
  background: transparent;
  border: 1px solid var(--border-hi);
  color: var(--text-mute);
  padding: 7px;
  border-radius: 5px;
  cursor: pointer;
  transition: color var(--t-fast), background var(--t-fast);
}
.menu-trigger:hover{ color: var(--silver); background: var(--accent-bg); }

/* ─────────────────────────────────────────────────────────────
   Responsive
   ───────────────────────────────────────────────────────────── */
@media (max-width: 1100px){
  .nav-links{ display: none; }
  .menu-trigger{ display: inline-flex; }
}
@media (max-width: 760px){
  .nav-inner{ padding: 0 16px; }
  .subbar{
    padding: 10px 16px;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
  }
  .proj-title{ font-size: 14px; }
  .proj-subtitle{ display: none; }
  .proj-title-eyebrow{ display: none; }
  .brand-name{ display: none; }
  .action-btn span{ display: none; }
  .back-btn span{ display: none; }
}

/* Focus ring */
:focus-visible{
  outline: 2px solid var(--silver);
  outline-offset: 2px;
  border-radius: 5px;
}

/* Selection */
::selection{ background: var(--accent-bd); color: var(--text); }
</style>
</head>

<body>

<script>
/* ─── Iframe load handling ─────────────────────────────── */
(function(){
  const frame  = document.getElementById('stage-frame');
  const loader = document.getElementById('stage-loader');
  const hide   = () => { loader.classList.add('is-hidden'); };
  if (frame.complete || frame.readyState === 'complete') hide();
  frame.addEventListener('load', hide);
  // safety: never let the loader hang
  setTimeout(hide, 6000);
})();

/* ─── Fullscreen toggle ────────────────────────────────── */
(function(){
  const btn   = document.getElementById('fs-btn');
  const stage = document.getElementById('stage');
  const frame = document.getElementById('stage-frame');
  btn.addEventListener('click', () => {
    const el = frame.requestFullscreen ? frame : stage;
    if (!document.fullscreenElement){
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } else {
      document.exitFullscreen();
    }
  });
})();

/* ─── Subtle cursor parallax on the brand logo ─────────── */
(function(){
  const logo = document.querySelector('.brand-logo');
  if (!logo) return;
  let raf = null;
  document.addEventListener('mousemove', (e) => {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const r = logo.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dx = (e.clientX - cx) / window.innerWidth;
      const dy = (e.clientY - cy) / window.innerHeight;
      logo.style.transform = `translate(${dx*-3}px, ${dy*-3}px)`;
    });
  });
})();
</script>
